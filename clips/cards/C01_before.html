<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css">
<style>
.wrap { display: grid; grid-template-columns: 1fr 120px 1fr; gap: 40px; margin-top: 70px; align-items: center; }
.panel { border: 2px solid var(--line); border-radius: 22px; height: 520px; position: relative; overflow: hidden; background: #fafbfc; }
.panel h4 { font-size: 26px; padding: 22px 28px; border-bottom: 2px solid var(--line); background: #fff; display: flex; justify-content: space-between; align-items: center; }
.badge { background: var(--red); color: #fff; border-radius: 999px; padding: 4px 16px; font-size: 24px; font-weight: 800; min-width: 70px; text-align: center; }
.mail { margin: 12px 22px 0; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 14px 18px; font-size: 22px; display: flex; gap: 14px; align-items: center; opacity: 0; animation: drop .4s ease-out forwards; }
.mail i { width: 14px; height: 14px; border-radius: 50%; background: #2457c5; flex: none; }
.mail span { color: var(--muted); }
@keyframes drop { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: none; } }
.arrow { font-size: 90px; color: #c3c8d0; text-align: center; }
.grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr; margin: 18px 22px; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
.grid div { border-bottom: 2px solid var(--line); border-right: 2px solid var(--line); padding: 14px; font-size: 22px; height: 58px; white-space: nowrap; overflow: hidden; }
.grid .h { font-weight: 700; background: #f1f3f6; }
.typed { display: inline-block; overflow: hidden; width: 0; animation: type 1.1s steps(18) forwards; border-right: 3px solid var(--red); }
@keyframes type { to { width: 100%; } }
.clock { position: absolute; right: 26px; bottom: 22px; font-size: 24px; font-weight: 700; color: var(--red); background: var(--red-bg); padding: 8px 16px; border-radius: 10px; opacity: 0; animation: in .5s 5.2s forwards; }
</style></head><body>
<div class="frame">
  <div class="kicker in">The problem</div>
  <div class="title in" style="animation-delay:.2s">50 to 100 enquiries a week, all read and copied by hand.</div>
  <div class="wrap">
    <div class="panel in" style="animation-delay:.5s">
      <h4>Shared inbox <span class="badge" id="count">0</span></h4>
      <div id="mails"></div>
    </div>
    <div class="arrow in" style="animation-delay:1s">&rarr;</div>
    <div class="panel in" style="animation-delay:1s">
      <h4>CRM <span style="font-size:22px;color:var(--muted)">typed in manually</span></h4>
      <div class="grid" id="grid">
        <div class="h">Company</div><div class="h">Budget</div><div class="h">Timeline</div>
      </div>
      <div class="clock">Hours every week</div>
    </div>
  </div>
</div>
<script>
const subjects = [["Quote for booking automation", "Freight firm"], ["Password reset not arriving", "Client"], ["Page 1 of Google GUARANTEED", "Unknown"], ["Invoice address is wrong", "Client"], ["Returns processing", "Retailer"], ["Patient intake forms", "Clinic group"], ["Partnership idea", "Agency"]];
const rows = [["Harbourline Freight", "$30k to $40k", "next month"], ["Lumen Ecommerce", "about $24k", "urgent"], ["Verity Dental", "about $25k", "soon"]];
let n = 0;
const mails = document.getElementById("mails"), count = document.getElementById("count");
subjects.forEach(([s, f], i) => setTimeout(() => {
  const d = document.createElement("div"); d.className = "mail";
  d.innerHTML = `<i></i><b>${s}</b><span>${f}</span>`;
  mails.prepend(d); if (mails.children.length > 6) mails.lastChild.remove();
}, 900 + i * 520));
const tick = setInterval(() => { n = Math.min(87, n + 3); count.textContent = n; if (n >= 87) clearInterval(tick); }, 120);
const grid = document.getElementById("grid");
rows.forEach((r, i) => setTimeout(() => {
  r.forEach((c) => { const d = document.createElement("div"); d.innerHTML = `<span class="typed">${c}</span>`; grid.appendChild(d); });
}, 1800 + i * 1200));
window.__duration = 8000;
</script></body></html>
